server:
  address: 127.0.0.1
  port: 8080

spring:
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

  redis:
    host: 127.0.0.1
    port: 6379
    database: 1
    connect-timeout: 3s
    timeout: 3s


  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: ${NACOS_NAMESPACE}
        group: QINGHE_MALL
        ip: 127.0.0.1
      config:
        server-addr: 127.0.0.1:8848
        namespace: ${NACOS_NAMESPACE}
        group: QINGHE_MALL

  config:
    import:
      - "nacos:qinghe-system-local.yaml?group=QINGHE_MALL&refreshEnabled=true"
management:
  endpoints:
    web:
      exposure:
        include: health,loggers

  endpoint:
    health:
      show-details: always


qinghe:
  storefront:
    allow-local-code-lookup: true
    local-code-hosts:
      - "127.0.0.1:5180"
      - "localhost:5180"
  redis:
    key-prefix: qinghe:local

