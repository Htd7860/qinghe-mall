server:
  address: ${GATEWAY_BIND_ADDRESS:127.0.0.1}
  port: ${GATEWAY_PORT:8088}
  # 保留真实连接对端；部署反向代理时另行配置可信代理，不能直接信任外来转发头。
  forward-headers-strategy: none

qinghe:
  gateway:
    system-base-url: ${SYSTEM_BASE_URL:http://127.0.0.1:8080}
    infra-base-url: ${INFRA_BASE_URL:http://127.0.0.1:8081}
    product-base-url: ${PRODUCT_BASE_URL:http://127.0.0.1:8082}
    trade-base-url: ${TRADE_BASE_URL:http://127.0.0.1:8083}
    member-base-url: ${MEMBER_BASE_URL:http://127.0.0.1:8084}
    promotion-base-url: ${PROMOTION_BASE_URL:http://127.0.0.1:8085}
    pay-base-url: ${PAY_BASE_URL:http://127.0.0.1:8086}
    login-rate-limit:
      max-requests: 60
      window-seconds: 60
      max-local-sources: 10000
      redis-timeout-millis: 200
      key-prefix: ${QINGHE_REDIS_KEY_PREFIX:qinghe:local}

spring:
  application:
    name: qinghe-gateway
  main:
    web-application-type: reactive
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 1
    connect-timeout: 1s
    timeout: 1s
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      httpclient:
        connect-timeout: 2000
        response-timeout: 15s
      routes:
        - id: pay-alipay-order-notify
          uri: ${qinghe.gateway.pay-base-url}
          predicates:
            - Path=/public-api/pay/notify/alipay/{channelId:[0-9]+}
            - Method=POST
        - id: product-public-catalog
          uri: ${qinghe.gateway.product-base-url}
          predicates:
            - Path=/app-api/product/spu/page,/app-api/product/spu/search-page,/app-api/product/spu/get-detail,/app-api/product/catalog/options
            - Method=GET
          filters:
            - PreserveHostHeader
            - RemoveRequestHeader=Forwarded
            - RemoveRequestHeader=X-Forwarded-Host
            - RemoveRequestHeader=X-Original-Host
        - id: promotion-member-seckill-browse
          uri: ${qinghe.gateway.promotion-base-url}
          predicates:
            - Path=/app-api/promotion/seckill-activity/page,/app-api/promotion/seckill-activity/get
            - Method=GET
          filters:
            - PreserveHostHeader
            - RemoveRequestHeader=Forwarded
            - RemoveRequestHeader=X-Forwarded-Host
            - RemoveRequestHeader=X-Original-Host
        - id: trade-seckill-quote
          uri: ${qinghe.gateway.trade-base-url}
          predicates:
            - Path=/app-api/trade/seckill/quote
            - Method=POST
          filters:
            - PreserveHostHeader
            - RemoveRequestHeader=Forwarded
            - RemoveRequestHeader=X-Forwarded-Host
            - RemoveRequestHeader=X-Original-Host
          metadata:
            response-timeout: 30000
        - id: trade-seckill-quote-result
          uri: ${qinghe.gateway.trade-base-url}
          predicates:
            - Path=/app-api/trade/seckill/quote-result
            - Method=GET
          filters:
            - PreserveHostHeader
            - RemoveRequestHeader=Forwarded
            - RemoveRequestHeader=X-Forwarded-Host
            - RemoveRequestHeader=X-Original-Host
          metadata:
            response-timeout: 30000
        - id: promotion-seckill-admit
          uri: ${qinghe.gateway.promotion-base-url}
          predicates:
            - Path=/app-api/promotion/seckill/admit
            - Method=POST
          filters:
